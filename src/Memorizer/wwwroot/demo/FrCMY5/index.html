<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Board - PRD 데모</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root{
            --primary:#667eea;
            --secondary:#764ba2;
            --bg:#f8f9fa;
        }
        body{background:var(--bg);}
        .navbar{background:linear-gradient(135deg,var(--primary),var(--secondary));}
        .navbar-brand,.nav-link{color:#fff!important;}
        .card{border:none;box-shadow:0 4px 20px rgba(0,0,0,0.1);border-radius:12px;}
        .btn-primary{background:linear-gradient(135deg,var(--primary),var(--secondary));border:none;}
        .btn-primary:hover{opacity:.9;}
        .modal-content{border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,0.2);}
    </style>
</head>
<body>

<header class="navbar navbar-expand-lg">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">Board 서비스</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navMenu"><span class="navbar-toggler-icon"></span></button>
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="#">게시글</a></li>
                <li class="nav-item"><a class="nav-link" href="#">알림 설정</a></li>
                <li class="nav-item"><a class="nav-link" href="#">마이 페이지</a></li>
            </ul>
        </div>
    </div>
</header>

<main class="container my-4">
    <!-- New Post Button -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="m-0">게시글 목록</h2>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#postModal"><i class="fas fa-plus"></i> 새 글 작성</button>
    </div>

    <!-- Sample Post List -->
    <div id="postList">
        <div class="card mb-3 p-3">
            <h5 class="card-title">샘플 게시물 제목 1</h5>
            <p class="card-text">이곳에 본문 내용이 표시됩니다. (예시 텍스트)</p>
            <button class="btn btn-sm btn-outline-primary me-2"><i class="far fa-comment"></i> 댓글 달기</button>
            <button class="btn btn-sm btn-outline-success"><i class="fas fa-edit"></i> 수정</button>
        </div>
        <div class="card mb-3 p-3">
            <h5 class="card-title">샘플 게시물 제목 2</h5>
            <p class="card-text">두 번째 샘플 게시물 내용입니다.</p>
            <button class="btn btn-sm btn-outline-primary me-2"><i class="far fa-comment"></i> 댓글 달기</button>
            <button class="btn btn-sm btn-outline-success"><i class="fas fa-edit"></i> 수정</button>
        </div>
    </div>
</main>

<!-- New Post Modal -->
<div class="modal fade" id="postModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="postForm">
                <div class="modal-header">
                    <h5 class="modal-title">새 게시글 작성</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="postTitle" class="form-label">제목 (≤150자)</label>
                        <input type="text" class="form-control" id="postTitle" maxlength="150" required>
                    </div>
                    <div class="mb-3">
                        <label for="postBody" class="form-label">본문 (≤2000자)</label>
                        <textarea class="form-control" id="postBody" rows="4" maxlength="2000" required></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-primary"><i class="fas fa-paper-plane"></i> 등록</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Toast Container -->
<div class="position-fixed bottom-0 end-0 p-3" style="z-index:1100;">
    <div id="toastMsg" class="toast align-items-center text-bg-primary border-0" role="alert">
        <div class="d-flex">
            <div class="toast-body"></div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto"
                    data-bs-dismiss="toast"></button>
        </div>
    </div>
</div>

<footer class="text-center py-3 mt-4 border-top">
    © 2026 Board 서비스. All rights reserved.
</footer>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Toast helper
    const toastEl = document.getElementById('toastMsg');
    const toast = new bootstrap.Toast(toastEl);

    function showToast(msg){
        toastEl.querySelector('.toast-body').textContent = msg;
        toast.show();
    }

    // Post form handling (mock)
    document.getElementById('postForm').addEventListener('submit',function(e){
        e.preventDefault();
        const title=document.getElementById('postTitle').value.trim();
        const body=document.getElementById('postBody').value.trim();

        if(title.length===0||body.length===0){
            showToast('제목과 본문을 입력해주세요.');
            return;
        }

        // mock add to list
        const postList=document.getElementById('postList');
        const card=document.createElement('div');
        card.className='card mb-3 p-3';
        card.innerHTML=`
            <h5 class="card-title">${title}</h5>
            <p class="card-text">${body.replace(/\n/g,'<br>')}</p>
            <button class="btn btn-sm btn-outline-primary me-2"><i class="far fa-comment"></i> 댓글 달기</button>
            <button class="btn btn-sm btn-outline-success"><i class="fas fa-edit"></i> 수정</button>`;
        postList.prepend(card);

        // reset & close modal
        this.reset();
        bootstrap.Modal.getInstance(document.getElementById('postModal')).hide();

        showToast('게시글이 성공적으로 등록되었습니다.');
    });
</script>
</body>
</html>
