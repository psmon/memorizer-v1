# Memorizer — Rancher 1.6 server deployment
#
# Rancher 1.6 only accepts compose file format v2 (no profiles, no env_file interpolation),
# so this file stays self-contained. Local/dev environments use docker-compose.yml + env/ presets.
#
# Deployed as stack "mcp-memory2" (v1.4.8): Custom LM Studio devices A (a1.webnori.com) / B (a2.webnori.com),
# SearXNG web search. Keys are placeholders — the real values live only in Rancher.
# Rancher-managed containers resolve only *.rancher.internal by default: services that call the
# internet need `dns: [8.8.8.8]` (memorizer, searxng).
# Ollama/pgadmin services exist in the stack but are inactive.
# Provider variable reference: env/llm-*.env, docker-compose.md
version: '2'
services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    container_name: postgmem-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgmem
    ports:
      - "5432:5432"
    volumes:
      - /opt/postgres/mcp_ver1:/var/lib/postgresql/data
    labels:
      io.rancher.scheduler.affinity:host_label: server=latemain

  neo4j:
    image: neo4j:5-community
    container_name: memorizer-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
      - NEO4J_dbms_memory_pagecache_size=1G
      - NEO4J_dbms_memory_heap_initial__size=1G
      - NEO4J_dbms_memory_heap_max__size=2G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    labels:
      io.rancher.scheduler.affinity:host_label: server=latemain

  pgadmin:
    image: dpage/pgadmin4
    restart: unless-stopped
    container_name: postgmem-pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@example.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    labels:
      io.rancher.scheduler.affinity:host_label: server=latemain

  ollama:
    image: ollama/ollama
    restart: unless-stopped
    container_name: postgmem-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    labels:
      io.rancher.scheduler.affinity:host_label: server=latemain

  # Initialize Ollama with the required models
  ollama-init:
    image: curlimages/curl:latest
    container_name: postgmem-ollama-init
    entrypoint: ["/bin/sh", "-c"]
    depends_on:
      - ollama
    command: >
      "
      echo 'Waiting for Ollama service to start...' &&
      sleep 15 &&

      echo 'Pulling embedding model...' &&
      for i in 1 2 3 4 5; do
        echo \"Attempting to pull embedding model (try \$i/5)...\" &&
        if curl -s -X POST http://ollama:11434/api/pull -d '{\"name\": \"all-minilm:33m-l12-v2-fp16\"}'; then
          echo 'Embedding model pull initiated successfully' &&
          break
        fi &&
        echo 'Ollama not ready yet for embedding model, waiting...' &&
        sleep 10
      done &&

      echo 'Pulling lightweight LLM model...' &&
      for i in 1 2 3 4 5; do
        echo \"Attempting to pull LLM model (try \$i/5)...\" &&
        if curl -s -X POST http://ollama:11434/api/pull -d '{\"name\": \"qwen2:0.5b\"}'; then
          echo 'LLM model pull initiated successfully' &&
          echo 'All models pulled successfully' &&
          exit 0
        fi &&
        echo 'Failed to pull LLM model, retrying...' &&
        sleep 10
      done &&
      echo 'Failed to pull models after multiple attempts' &&
      exit 1
      "
    labels:
      io.rancher.scheduler.affinity:host_label: server=latemain
      io.rancher.container.start_once: 'true'

  # SearXNG with settings baked in (searxng/Dockerfile) — no host file mount needed
  searxng:
    image: registry.webnori.com/memorizer-searxng:v1.4.7
    restart: always
    dns:
      - 8.8.8.8
    environment:
      SEARXNG_SECRET: change-me
      SEARXNG_BASE_URL: http://searxng:8080/
    labels:
      io.rancher.scheduler.affinity:host_label: server=latemain
      io.rancher.container.pull_image: always

  memorizer:
    image: registry.webnori.com/memorizer:v1.4.8
    container_name: memorizer-app
    ports:
      - "5000:8080"
    dns:
      - 8.8.8.8
    volumes:
      - /media/psmon/ssd/askbot-images:/app/data/askbot-images
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Storage: Host=postgres;Port=5432;Database=postgmem;Username=postgres;Password=postgres
      # ── Custom LM Studio devices (env/llm-custom.env) ──
      MEMORIZER_Embeddings__Type: Custom
      # Embeddings on device B: EmbeddingGemma (768 dims, much better Korean retrieval than nomic)
      MEMORIZER_Embeddings__ApiUrl: https://a2.webnori.com
      MEMORIZER_Embeddings__Model: text-embedding-embeddinggemma-2
      MEMORIZER_Embeddings__ApiKey: sk-lm-device-b
      MEMORIZER_LLM__Type: Custom
      MEMORIZER_LLM__ApiUrl: https://a1.webnori.com
      MEMORIZER_LLM__Model: google/gemma-4-e4b
      MEMORIZER_LLM__Timeout: 00:02:00
      MEMORIZER_LLM__ApiKey: sk-lm-device-a
      MEMORIZER_LLM-EX__Type: Custom
      MEMORIZER_LLM-EX__ApiUrl: https://a1.webnori.com
      MEMORIZER_LLM-EX__Model: google/gemma-4-26b-a4b
      MEMORIZER_LLM-EX__Timeout: 00:05:00
      MEMORIZER_LLM-EX__ApiKey: sk-lm-device-a
      MEMORIZER_MultiModal__Type: Custom
      MEMORIZER_MultiModal__ApiUrl: https://a2.webnori.com
      MEMORIZER_MultiModal__Model: qwen/qwen3.8-27b
      MEMORIZER_MultiModal__ApiKey: sk-lm-device-b
      # ── Web search (SearXNG service in this stack) ──
      MEMORIZER_WebSearch__AccessMode: Fetch
      MEMORIZER_WebSearch__ProviderChain: SearXng
      MEMORIZER_WebSearch__SearXng__ApiUrl: http://searxng:8080
      ASKBOT_IMAGE_STORAGE_PATH: /app/data/askbot-images
      # ── Common ──
      MEMORIZER_LLM__Chunking__MinCharactersForChunking: '2000'
      MEMORIZER_LLM__Chunking__TargetChunkSize: '1500'
      Neo4j__Uri: bolt://neo4j:7687
      Neo4j__User: neo4j
      Neo4j__Password: password
      Neo4j__Database: neo4j
      MEMORIZER_Server__CanonicalUrl: https://mcp.webnori.com
      MEMORIZER_Server__UserName: admin
      MEMORIZER_Server__Password: admin123
      MEMORIZER_Server__ApiKey: your_api_key_here
      # OAuth 2.0 Settings
      MEMORIZER_OAuth__Enabled: "true"
      MEMORIZER_OAuth__Issuer: memorizer
      MEMORIZER_OAuth__Audience: memorizer-api
      MEMORIZER_OAuth__SecretKey: your-super-secret-key-at-least-32-characters-long
      MEMORIZER_OAuth__TokenExpirationHours: "24"
      # OAuth Client (for ChatGPT MCP integration)
      MEMORIZER_OAuth__Clients__0__ClientId: chatgpt-mcp
      MEMORIZER_OAuth__Clients__0__ClientSecret: chatgpt-secret-key
      MEMORIZER_OAuth__Clients__0__AllowedScopes__0: "mcp:read"
      MEMORIZER_OAuth__Clients__0__AllowedScopes__1: "mcp:write"
      MEMORIZER_OAuth__Clients__0__AllowedRedirectUris__0: "https://chatgpt.com/aip/g-callback"
    depends_on:
      - postgres
      - neo4j
      - searxng
    labels:
      io.rancher.scheduler.affinity:host_label: server=latemain
      io.rancher.container.pull_image: always

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:
  ollama_data:
