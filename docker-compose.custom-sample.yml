version: '3.8'

services:
  # Memorizer application
  memorizer:
    build:
      context: .
      dockerfile: src/Memorizer/Dockerfile
    container_name: memorizer-app
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Storage: Host=postgres;Port=5432;Database=postgmem;Username=postgres;Password=postgres
      # Custom configuration for external embedding and LLM services
      MEMORIZER_Embeddings__Type: Custom
      MEMORIZER_Embeddings__ApiUrl: http://192.168.0.50:1234
      MEMORIZER_Embeddings__Model: text-embedding-all-minilm-l12-v2      
      # Custom LLM configuration
      MEMORIZER_LLM__Type: Custom
      MEMORIZER_LLM__ApiUrl: http://192.168.0.50:1234
      MEMORIZER_LLM__Chunking__MinCharactersForChunking: '2000'
      MEMORIZER_LLM__Chunking__TargetChunkSize: '1500'
      MEMORIZER_LLM__Model: openai/gpt-oss-20b
      MEMORIZER_LLM__Timeout: 00:02:00
      # LLM-EX configuration (Custom - for deep analysis with high capacity models)
      MEMORIZER_LLM-EX__Type: Custom
      MEMORIZER_LLM-EX__ApiUrl: http://192.168.0.50:1234
      MEMORIZER_LLM-EX__Model: openai/gpt-oss-120b
      MEMORIZER_LLM-EX__Timeout: 00:05:00
      # Neo4j configuration
      Neo4j__Uri: bolt://neo4j:7687
      Neo4j__User: neo4j
      Neo4j__Password: password
      Neo4j__Database: neo4j
      MEMORIZER_Server__CanonicalUrl: http://localhost:5000
      MEMORIZER_Server__UserName: admin
      MEMORIZER_Server__Password: admin123
      MEMORIZER_Server__ApiKey: your-api-key-here
      # OAuth 2.0 Settings
      MEMORIZER_OAuth__Enabled: "true"
      MEMORIZER_OAuth__Issuer: memorizer
      MEMORIZER_OAuth__Audience: memorizer-api
      MEMORIZER_OAuth__SecretKey: your-super-secret-key-at-least-32-characters-long
      MEMORIZER_OAuth__TokenExpirationHours: "24"
      # OAuth Client (for ChatGPT MCP integration)
      MEMORIZER_OAuth__Clients__0__ClientId: chatgpt-mcp
      MEMORIZER_OAuth__Clients__0__ClientSecret: chatgpt-secret-key
      MEMORIZER_OAuth__Clients__0__AllowedScopes__0: "mcp:read"
      MEMORIZER_OAuth__Clients__0__AllowedScopes__1: "mcp:write"
      MEMORIZER_OAuth__Clients__0__AllowedRedirectUris__0: "https://chatgpt.com/aip/g-callback"
    ports:
      - "5000:8080"        
    labels:
      io.rancher.scheduler.affinity:host_label: server=latemain